<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вывод звезд - GetGems</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0A0A0A;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        .stars-container {
            max-width: 480px;
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border-radius: 28px;
            padding: 40px 32px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            position: relative;
            z-index: 1;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .star-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.2), rgba(255, 165, 0, 0.2));
            border-radius: 50%;
            border: 2px solid rgba(255, 215, 0, 0.3);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
            }
            50% {
                box-shadow: 0 0 40px rgba(255, 215, 0, 0.6);
            }
        }

        .star-icon svg {
            width: 48px;
            height: 48px;
            fill: #FFD700;
            filter: drop-shadow(0 4px 12px rgba(255, 215, 0, 0.5));
        }

        .stars-title {
            font-size: 26px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 12px;
            color: #ffffff;
            letter-spacing: -0.3px;
        }

        .stars-subtitle {
            font-size: 15px;
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .balance-display {
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.1), rgba(255, 165, 0, 0.1));
            border: 1.5px solid rgba(255, 215, 0, 0.3);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            margin-bottom: 32px;
        }

        .balance-label {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .balance-amount {
            font-size: 36px;
            font-weight: 700;
            color: #FFD700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .balance-amount .star-small {
            width: 28px;
            height: 28px;
            fill: #FFD700;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .amount-input-wrapper {
            position: relative;
            margin-bottom: 24px;
        }

        .amount-input {
            width: 100%;
            padding: 20px 60px 20px 24px;
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            color: #fff;
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        
        .min-amount-hint {
            text-align: center;
            font-size: 13px;
            color: rgba(255, 215, 0, 0.7);
            margin-top: 8px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .amount-input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .amount-input:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 215, 0, 0.4);
        }

        .amount-input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.08);
            border-color: #FFD700;
            box-shadow: 0 0 0 4px rgba(255, 215, 0, 0.15);
        }

        .amount-input.error {
            border-color: #ff4444;
            box-shadow: 0 0 0 4px rgba(255, 68, 68, 0.15);
        }


        .slider-wrapper {
            margin-bottom: 32px;
        }

        .slider-container {
            position: relative;
            padding: 12px 0;
        }

        .slider {
            -webkit-appearance: none;
            width: 100%;
            height: 8px;
            border-radius: 8px;
            background: linear-gradient(to right, 
                rgba(255, 215, 0, 0.3) 0%, 
                rgba(255, 215, 0, 0.1) 100%);
            outline: none;
            transition: all 0.3s ease;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 215, 0, 0.5);
            transition: all 0.3s ease;
        }

        .slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.7);
        }

        .slider::-moz-range-thumb {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 12px rgba(255, 215, 0, 0.5);
            transition: all 0.3s ease;
        }

        .slider::-moz-range-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.7);
        }

        .slider-labels {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
        }

        .quick-amounts {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin-bottom: 32px;
        }
        
        .quick-amount-btn .max-badge {
            font-size: 11px;
            color: rgba(255, 215, 0, 0.8);
            font-weight: 700;
        }

        .quick-amount-btn {
            padding: 18px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 215, 0, 0.3);
            border-radius: 16px;
            color: #FFD700;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .quick-amount-btn:hover {
            background: rgba(255, 215, 0, 0.1);
            border-color: rgba(255, 215, 0, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 215, 0, 0.2);
        }

        .quick-amount-btn:active {
            transform: translateY(0);
        }

        .quick-amount-btn.selected {
            background: rgba(255, 215, 0, 0.2);
            border-color: #FFD700;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 32px;
        }

        .btn {
            flex: 1;
            padding: 20px 28px;
            border: none;
            border-radius: 18px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            position: relative;
            overflow: hidden;
        }

        .btn-cancel {
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.7);
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }

        .btn-cancel:active {
            transform: translateY(0);
        }

        .btn-withdraw {
            background: linear-gradient(135deg, #007AFF 0%, #0051D5 100%);
            color: #ffffff;
            box-shadow: 0 8px 24px rgba(0, 122, 255, 0.4);
            border: 1px solid rgba(0, 122, 255, 0.2);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .btn-withdraw::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.6s ease;
        }

        .btn-withdraw:hover::before {
            left: 100%;
        }

        .btn-withdraw:hover {
            box-shadow: 0 12px 32px rgba(0, 122, 255, 0.6);
            transform: translateY(-2px);
        }

        .btn-withdraw:active {
            transform: translateY(0);
        }

        .btn-withdraw:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            color: #ff4444;
            font-size: 13px;
            text-align: center;
            margin-top: 12px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        @media (max-width: 480px) {
            .stars-container {
                padding: 32px 24px;
            }

            .balance-amount {
                font-size: 32px;
            }

            .amount-input {
                font-size: 20px;
                padding: 18px 50px 18px 20px;
            }

            .star-suffix {
                right: 20px;
            }

            .quick-amounts {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="stars-container">
        <div class="star-icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
            </svg>
        </div>

        <h1 class="stars-title">Вывод звезд</h1>
        <p class="stars-subtitle">
            Выберите количество звезд<br>для вывода на ваш кошелек
        </p>

        <div class="balance-display">
            <div class="balance-label">Доступный баланс</div>
            <div class="balance-amount">
                <svg class="star-small" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
                </svg>
                <span id="balanceAmount">0</span>
            </div>
        </div>

        <form id="withdrawForm">
            <div class="form-group">
                <label class="form-label">Быстрый выбор</label>
                <div class="quick-amounts" id="quickAmounts">
                    <button type="button" class="quick-amount-btn" data-amount="100">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="width: 16px; height: 16px; fill: currentColor;">
                            <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
                        </svg>
                        100
                    </button>
                    <button type="button" class="quick-amount-btn" data-amount="250">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="width: 16px; height: 16px; fill: currentColor;">
                            <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
                        </svg>
                        250
                    </button>
                    <button type="button" class="quick-amount-btn" data-max="true" id="maxBtn">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="width: 16px; height: 16px; fill: currentColor;">
                            <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
                        </svg>
                        <span id="maxBtnAmount">0</span> <span class="max-badge">(max)</span>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Количество звезд</label>
                <div class="amount-input-wrapper">
                    <input type="number" class="amount-input" id="amountInput" placeholder="0" min="50" step="1">
                    <svg class="star-suffix" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="position: absolute; right: 24px; top: 50%; transform: translateY(-50%); width: 24px; height: 24px; fill: #FFD700;">
                        <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
                    </svg>
                </div>
                <div class="min-amount-hint">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="width: 14px; height: 14px; fill: currentColor;">
                        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="none"/>
                        <path d="M12 7v6M12 16h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    Минимум 50 звёзд для вывода
                </div>
            </div>

            <div class="slider-wrapper">
                <label class="form-label">Ползунок</label>
                <div class="slider-container">
                    <input type="range" class="slider" id="amountSlider" min="50" max="100" value="50" step="1">
                    <div class="slider-labels">
                        <span>50</span>
                        <span id="maxLabel">100</span>
                    </div>
                </div>
            </div>

            <div class="error-message" id="errorMessage"></div>

            <div class="button-group">
                <button type="button" class="btn btn-cancel" id="cancelBtn">Отмена</button>
                <button type="submit" class="btn btn-withdraw" id="withdrawBtn" disabled>Вывести</button>
            </div>
        </form>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let userBalance = 0;
        
        const loadBalance = async () => {
            try {
                const userId = tg.initDataUnsafe?.user?.id || 'web_user';
                const response = await fetch(`/api/user/balance?user_id=${userId}`);
                
                if (response.ok) {
                    const data = await response.json();
                    userBalance = data.balance || 0;
                } else {
                    userBalance = 1000;
                }
            } catch (error) {
                console.error('Error loading balance:', error);
                userBalance = 1000;
            }

            document.getElementById('balanceAmount').textContent = userBalance;
            document.getElementById('amountSlider').max = userBalance;
            document.getElementById('maxLabel').textContent = userBalance;
            
            // Обновляем кнопку MAX
            document.getElementById('maxBtnAmount').textContent = userBalance;
        };

        loadBalance();

        const amountInput = document.getElementById('amountInput');
        const amountSlider = document.getElementById('amountSlider');
        const withdrawBtn = document.getElementById('withdrawBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const errorMessage = document.getElementById('errorMessage');
        const quickAmountBtns = document.querySelectorAll('.quick-amount-btn');

        amountInput.addEventListener('input', (e) => {
            let value = parseInt(e.target.value) || 0;
            
            if (value > userBalance) {
                value = userBalance;
                e.target.value = value;
            }

            amountSlider.value = value;
            updateWithdrawButton(value);
            clearQuickSelection();
            hideError();
        });

        amountSlider.addEventListener('input', (e) => {
            const value = parseInt(e.target.value);
            amountInput.value = value;
            updateWithdrawButton(value);
            clearQuickSelection();
            hideError();
        });

        quickAmountBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const amount = btn.dataset.amount;
                const isMax = btn.dataset.max === 'true';
                
                let value;
                if (isMax) {
                    value = userBalance;
                } else if (amount) {
                    value = Math.min(parseInt(amount), userBalance);
                }

                amountInput.value = value;
                amountSlider.value = value;
                updateWithdrawButton(value);
                
                clearQuickSelection();
                btn.classList.add('selected');
                hideError();
            });
        });

        function clearQuickSelection() {
            quickAmountBtns.forEach(btn => btn.classList.remove('selected'));
        }

        function updateWithdrawButton(value) {
            if (value >= 50 && value <= userBalance) {
                withdrawBtn.disabled = false;
                amountInput.classList.remove('error');
            } else {
                withdrawBtn.disabled = true;
                if (value < 50) {
                    showError('Минимум 50 звёзд');
                    amountInput.classList.add('error');
                } else if (value > userBalance) {
                    showError(`Максимум ${userBalance} звезд`);
                    amountInput.classList.add('error');
                }
            }
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
        }

        function hideError() {
            errorMessage.classList.remove('show');
        }

        cancelBtn.addEventListener('click', () => {
            window.location.href = '/success';
        });

        document.getElementById('withdrawForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const amount = parseInt(amountInput.value);
            
            if (amount < 50) {
                showError('Минимум 50 звёзд для вывода');
                return;
            }
            
            if (amount > userBalance) {
                showError('Недостаточно средств');
                return;
            }

            withdrawBtn.disabled = true;
            withdrawBtn.textContent = 'Обработка...';

            try {
                const userId = tg.initDataUnsafe?.user?.id || 'web_user';
                
                const response = await fetch('/api/withdraw/stars', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: userId,
                        amount: amount
                    })
                });

                const data = await response.json();

                if (data && data.success) {
                    tg.showAlert(`Успешно выведено ${amount} звезд!`, () => {
                        window.location.href = '/success';
                    });
                } else {
                    showError(data.error || 'Ошибка вывода');
                    withdrawBtn.disabled = false;
                    withdrawBtn.textContent = 'Вывести';
                }
            } catch (error) {
                console.error('Error:', error);
                showError('Ошибка сети');
                withdrawBtn.disabled = false;
                withdrawBtn.textContent = 'Вывести';
            }
        });
    </script>
</body>
</html>
